[workspace]
resolver = "2"
members = [
  "libspa-sys",
  "libspa",
  "pipewire-sys",
  "pipewire",
]

[workspace.package]
authors = ["Tom Wagner <tom.a.wagner@protonmail.com>", "Guillaume Desmottes <guillaume.desmottes@collabora.com>"]
categories = ["api-bindings", "multimedia"]
edition = "2021"
homepage = "https://pipewire.org"
license = "MIT"
repository = "https://gitlab.freedesktop.org/pipewire/pipewire-rs"
# When bumping MSRV, don't forget to update it also in .gitlab-ci.yml
rust-version = "1.79"
version = "0.9.2"

[workspace.dependencies]
pipewire = { version = "0.9", path = "./pipewire" }
pipewire-sys = { version = "0.9", path = "./pipewire-sys" }

# Aliases
pw_sys = { package = "pipewire-sys", version = "0.9", path = "./pipewire-sys" }
spa_sys = { package = "libspa-sys", version = "0.9", path = "./libspa-sys" }
spa = { package = "libspa", version = "0.9", path = "./libspa" }

# External
libc = "0.2"
rustix = { version = "1.1", features = ["std", "fs", "process", "time", "pipe"] }
bitflags = "2"
once_cell = "1.0"
cookie-factory = { version = "0.3.3", default-features = false }
nom = "8.0.0"
convert_case = "0.8.0"

# External - dev
clap = "4.3.2"

# External - build
bindgen = { version = "0.72.0", default-features = false }
system-deps = "7.0.5"
cc = "1.0.61"
